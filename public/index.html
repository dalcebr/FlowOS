<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="description" content="FlowOS — ambiente de desenvolvimento visual para Termux">
<title>FlowOS</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login-screen">
  <div class="login-glow"></div>
  <div class="login-card">
    <div class="brand-mark">F</div>
    <div class="login-brand">FlowOS</div>
    <div class="login-tag">Seu computador de desenvolvimento dentro do Termux.</div>
    <form id="loginForm">
      <label class="field-label">Senha</label>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="Senha do FlowOS">
      <button class="primary wide" type="submit">Entrar</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <button id="menuBtn" class="icon-btn mobile-only" aria-label="Menu">☰</button>
    <button id="brandBtn" class="brand-mini"><span>F</span><b>FlowOS</b></button>
    <div class="breadcrumb" id="breadcrumb">Área de trabalho</div>
    <div class="top-actions">
      <div class="health" id="health"><i></i><span>online</span></div>
      <button class="icon-btn" id="quickTerminal" title="Abrir terminal">›_</button>
      <button class="icon-btn" id="settingsBtn" title="Ajustes">⚙</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="side-scroll">
      <div class="side-title launcher-title">Aplicativos</div>
      <div class="nav-section">
        <button class="nav-item active" data-view="home"><span>⌂</span><b>Início</b></button>
        <button class="nav-item" data-view="projects"><span>▦</span><b>Projetos</b></button>
        <button class="nav-item" data-view="files"><span>□</span><b>Arquivos</b></button>
        <button class="nav-item" data-view="editor"><span>✎</span><b>Editor</b></button>
        <button class="nav-item" data-view="markdown"><span>M</span><b>Markdown</b></button>
        <button class="nav-item" data-view="terminal"><span>›_</span><b>Terminal</b></button>
        <button class="nav-item" data-view="git"><span>⌘</span><b>Git / GitHub</b><em id="gitBadge"></em></button>
      </div>
      <div class="side-title">Sistema</div>
      <div class="nav-section">
        <button class="nav-item" data-view="processes"><span>◌</span><b>Processos</b></button>
        <button class="nav-item" data-view="system"><span>◈</span><b>Status do sistema</b></button>
        <button class="nav-item" data-view="settings"><span>⚙</span><b>Ajustes</b></button>
      </div>
    </div>
    <div class="side-bottom">
      <div class="user-chip"><span class="avatar">F</span><div><b id="sideUser">flow</b><small>Termux</small></div></div>
    </div>
  </aside>

  <main id="main" class="desktop"></main>
  <div id="taskbar" class="taskbar"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
