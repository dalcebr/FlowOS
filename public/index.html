<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <title>FlowOS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- LOCK -->
  <div id="lock" class="layer">
    <div class="lk-bg" id="lkBg"></div>
    <div class="lk-clock" id="lkClock">
      <span id="lkTime" class="lk-time">00:00</span>
      <span id="lkDate" class="lk-date">segunda-feira, 1 de janeiro</span>
    </div>
    <div class="lk-login" id="lkLogin">
      <div class="lk-avatar" id="lkAvatar"></div>
      <p class="lk-user" id="lkUser">FlowOS</p>
      <div class="lk-field">
        <input id="lkPwd" type="password" placeholder="Senha" autocomplete="off">
        <button id="lkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
      <p id="lkErr" class="lk-err"></p>
    </div>
    <p class="lk-hint" id="lkHint">Clique para entrar</p>
  </div>

  <!-- DESKTOP -->
  <div id="desk" class="layer gone">
    <div class="wallpaper" id="wallpaper"></div>

    <!-- Menu Bar (top) -->
    <div class="menubar">
      <div class="mb-left">
        <span class="mb-apple">⚡</span>
        <span class="mb-app" id="mbApp">FlowOS</span>
      </div>
      <div class="mb-right">
        <span class="mb-item" id="mbCpu">CPU --%</span>
        <span class="mb-item" id="mbRam">RAM --%</span>
        <span class="mb-sep"></span>
        <svg class="mb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
        <svg class="mb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="16" height="10" rx="1.5"/><line x1="22" y1="11" x2="22" y2="13"/><rect x="4" y="9" width="9" height="6" rx=".5" fill="currentColor" opacity=".25"/></svg>
        <span class="mb-sep"></span>
        <span class="mb-clock" id="mbClock">00:00</span>
        <span class="mb-date" id="mbDate">qui. 2 out.</span>
      </div>
    </div>

    <!-- Windows -->
    <div id="winLayer" class="win-layer"></div>

    <!-- Dock -->
    <div class="dock" id="dock">
      <div class="dock-inner" id="dockInner"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="apps/terminal.js"></script>
  <script src="apps/files.js"></script>
  <script src="apps/editor.js"></script>
  <script src="apps/settings.js"></script>
</body>
</html>
